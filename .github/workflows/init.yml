name: Initialize KMP Project Template

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Human-readable project name (e.g. Multiplatform Template App)'
        required: true
        type: string
      package_name:
        description: 'Root Kotlin package (dotted, e.g. com.template.app)'
        required: true
        type: string
      include_android:
        description: 'Include Android target'
        required: true
        default: true
        type: boolean
      include_ios:
        description: 'Include iOS target'
        required: true
        default: true
        type: boolean
      include_web:
        description: 'Include Web (JS + WasmJS) target'
        required: true
        default: true
        type: boolean
      include_desktop:
        description: 'Include Desktop (JVM) target'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  initialize:
    name: Initialize template via scripts/init.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/init.sh
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          INC_AND: ${{ inputs.include_android }}
          INC_IOS: ${{ inputs.include_ios }}
          INC_WEB: ${{ inputs.include_web }}
          INC_DSK: ${{ inputs.include_desktop }}
        run: |
          set -euo pipefail
          chmod +x scripts/init.sh
          bash scripts/init.sh \
            --project-name "${PROJECT_NAME}" \
            --package-name "${PACKAGE_NAME}" \
            --android      "${INC_AND}" \
            --ios          "${INC_IOS}" \
            --web          "${INC_WEB}" \
            --desktop      "${INC_DSK}" \
            --skip-install

      - name: Commit and push
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize ${PROJECT_NAME} from template"
          git push

