name: Initialize KMP Project Template

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Human-readable project name (e.g. Multiplatform Template App)'
        required: true
        type: string
      package_name:
        description: 'Root Kotlin package (dotted, e.g. com.template.app)'
        required: true
        type: string
      include_android:
        description: 'Include Android target'
        required: true
        default: true
        type: boolean
      include_ios:
        description: 'Include iOS target'
        required: true
        default: true
        type: boolean
      include_web:
        description: 'Include Web (JS + WasmJS) target'
        required: true
        default: true
        type: boolean
      include_desktop:
        description: 'Include Desktop (JVM) target'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  initialize:
    name: Rewrite placeholders and prune unselected platforms
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      PACKAGE_NAME: ${{ inputs.package_name }}
      INC_AND: ${{ inputs.include_android }}
      INC_IOS: ${{ inputs.include_ios }}
      INC_WEB: ${{ inputs.include_web }}
      INC_DSK: ${{ inputs.include_desktop }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$PROJECT_NAME" | grep -Eq '^[A-Za-z][A-Za-z0-9_-]*$'; then
            echo "::error::project_name must start with a letter and contain only [A-Za-z0-9_-]."
            exit 1
          fi
          if ! printf '%s' "$PACKAGE_NAME" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "::error::package_name must be a valid dotted lowercase Kotlin package."
            exit 1
          fi
          if [ "$INC_AND" != "true" ] && [ "$INC_IOS" != "true" ] && [ "$INC_WEB" != "true" ] && [ "$INC_DSK" != "true" ]; then
            echo "::error::At least one platform checkbox must be enabled."
            exit 1
          fi

      - name: Compute package path
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_PATH="${PACKAGE_NAME//./\/}"
          echo "PACKAGE_PATH=${PACKAGE_PATH}" >> "$GITHUB_ENV"

      - name: Rewrite placeholders
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -rIl --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
            -e '{{PROJECT_NAME}}' -e '{{PACKAGE_NAME}}' -e '{{PACKAGE_PATH}}' . || true)
          for f in "${FILES[@]}"; do
            sed -i \
              -e "s|{{PROJECT_NAME}}|${PROJECT_NAME}|g" \
              -e "s|{{PACKAGE_NAME}}|${PACKAGE_NAME}|g" \
              -e "s|{{PACKAGE_PATH}}|${PACKAGE_PATH}|g" \
              "$f"
          done

      - name: Rename Kotlin package directories
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.kt' -not -path './build/*' -not -path './.gradle/*' \
            -exec sed -i "s|org\.company\.app|${PACKAGE_NAME}|g" {} +

          for module in sharedUI androidApp desktopApp webApp iosApp; do
            for src_root in "$module"/src/*/kotlin; do
              [ -d "$src_root/org/company/app" ] || continue
              mkdir -p "$src_root/$PACKAGE_PATH"
              shopt -s dotglob nullglob
              mv "$src_root/org/company/app/"* "$src_root/$PACKAGE_PATH/" 2>/dev/null || true
              shopt -u dotglob nullglob
              rm -rf "$src_root/org"
            done
          done

      - name: Prune unselected platforms
        shell: bash
        run: |
          set -euo pipefail

          delete_region() {
            local plat="$1"
            find . -type f \( -name 'build.gradle.kts' -o -name 'settings.gradle.kts' \) \
              -not -path './build/*' -not -path './.gradle/*' \
              -exec sed -i "/\/\/ region ${plat}\b/,/\/\/ endregion ${plat}\b/d" {} +
          }

          drop_module() {
            local module="$1"
            rm -rf "$module"
            sed -i "/include(\":${module}\")/d" settings.gradle.kts
          }

          if [ "$INC_AND" != "true" ]; then
            delete_region android
            drop_module androidApp
          fi
          if [ "$INC_IOS" != "true" ]; then
            delete_region ios
            drop_module iosApp
          fi
          if [ "$INC_WEB" != "true" ]; then
            delete_region web
            drop_module webApp
          fi
          if [ "$INC_DSK" != "true" ]; then
            delete_region desktop
            drop_module desktopApp
          fi

      - name: Persist .template.config
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Generated by .github/workflows/init.yml - do not edit by hand."
            echo "PROJECT_NAME=${PROJECT_NAME}"
            echo "PACKAGE_NAME=${PACKAGE_NAME}"
            echo "INCLUDE_ANDROID=${INC_AND}"
            echo "INCLUDE_IOS=${INC_IOS}"
            echo "INCLUDE_WEB=${INC_WEB}"
            echo "INCLUDE_DESKTOP=${INC_DSK}"
          } > .template.config

      - name: Self-destruct init workflow
        shell: bash
        run: git rm .github/workflows/init.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize ${PROJECT_NAME} from template"
          git push

